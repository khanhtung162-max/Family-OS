<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Góc học của em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF6E9; --ink: #332B52; --ink-soft: #6B6289;
    --coral: #FF6B5B; --coral-soft: #FFE1DC;
    --grape: #8B5CF6; --grape-soft: #EBE1FF;
    --teal: #17B8A6; --teal-soft: #D6F5F0;
    --sun: #FFB627; --sun-soft: #FFF0D1;
    --leaf: #4CB963; --white: #FFFFFF;
    --shadow: 0 6px 0 rgba(51,43,82,0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--cream); font-family: 'Quicksand', sans-serif; color: var(--ink); display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 400px; min-height: 100vh; padding: 20px 18px 40px; position: relative; overflow-x: hidden; }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; gap: 14px; }
  .loading .spin { font-size: 40px; animation: spin 1.2s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  .loading p { font-family: 'Baloo 2', sans-serif; font-weight: 600; color: var(--ink-soft); }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }

  .picker-title { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; text-align: center; margin: 30px 0 6px; }
  .picker-sub { text-align: center; color: var(--ink-soft); font-weight: 600; margin-bottom: 28px; }
  .kid-list { display: flex; flex-direction: column; gap: 14px; }
  .kid-card { display: flex; align-items: center; gap: 16px; background: var(--white); border: none; border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow); cursor: pointer; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 19px; color: var(--ink); text-align: left; transition: transform 0.12s ease; width: 100%; }
  .kid-card:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(51,43,82,0.12); }
  .kid-avatar { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 8px; }
  .back-btn { background: none; border: none; font-size: 20px; color: var(--ink-soft); cursor: pointer; padding: 6px 10px; flex-shrink: 0; border-radius: 12px; font-weight: 700; transition: background 0.15s ease; }

  .term-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .term-btn { flex: 1; border: none; background: var(--white); border-radius: 14px; padding: 10px 0; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 13px; color: var(--ink-soft); box-shadow: var(--shadow); cursor: pointer; transition: transform 0.12s ease; }
  .term-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(51,43,82,0.12); }
  .term-btn.active { background: var(--grape); color: white; }
  .greet { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; }
  .greet span.wave { display: inline-block; animation: wave 2.2s ease-in-out infinite; transform-origin: 70% 70%; }
  @keyframes wave { 0%,60%,100%{transform:rotate(0deg);} 10%{transform:rotate(14deg);} 20%{transform:rotate(-8deg);} 30%{transform:rotate(14deg);} 40%{transform:rotate(-4deg);} }
  .streak { display: flex; align-items: center; gap: 6px; background: var(--white); border-radius: 999px; padding: 8px 14px 8px 10px; box-shadow: var(--shadow); font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14px; color: var(--coral); flex-shrink: 0; }
  .streak .flame { font-size: 17px; animation: flicker 1.6s ease-in-out infinite; }
  @keyframes flicker { 0%,100%{transform:scale(1) rotate(-2deg);} 50%{transform:scale(1.12) rotate(3deg);} }

  .section-label { font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink-soft); margin: 4px 0 10px 2px; }

  .subjects { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 26px; }
  .tile { border: none; border-radius: 22px; padding: 18px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; cursor: pointer; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; text-align: left; box-shadow: var(--shadow); transition: transform 0.12s ease; }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(51,43,82,0.12); }
  .tile .emoji { font-size: 28px; }
  .tile .progress-track { width: 100%; height: 8px; background: rgba(255,255,255,0.6); border-radius: 99px; overflow: hidden; }
  .tile .progress-fill { height: 100%; border-radius: 99px; background: rgba(51,43,82,0.35); }
  .tile .progress-text { font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 12px; opacity: 0.85; }
  .no-data { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-weight: 600; }

  /* ---- Unit group card ---- */
  .unit-card { background: var(--white); border-radius: 20px; margin-bottom: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .unit-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px; cursor: pointer; }
  .unit-header .title { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; }
  .unit-header .meta { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }
  .unit-header .chevron { font-size: 14px; color: var(--ink-soft); transition: transform 0.2s ease; }
  .unit-card.open .chevron { transform: rotate(90deg); }
  .unit-badge { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; margin-right: 10px; }
  .unit-badge.done { background: var(--leaf); color: white; }
  .unit-badge.partial { background: var(--sun-soft); color: #A66A00; }
  .unit-badge.todo { background: #EFECF6; color: var(--ink-soft); }
  .unit-head-row { display: flex; align-items: center; flex: 1; min-width: 0; }
  .unit-head-text { min-width: 0; flex: 1; }
  .unit-head-text .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .unit-sublist { display: none; padding: 0 14px 14px; }
  .unit-card.open .unit-sublist { display: block; }
  .sub-item { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid #F2EFFA; cursor: pointer; }
  .sub-item:active { background: #FBFAFF; }
  .sub-tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #D9D3EE; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .sub-tick.checked { background: var(--leaf); border-color: var(--leaf); color: white; }
  .sub-name { font-size: 14px; font-weight: 600; }

  .quiz-card { background: var(--white); border-radius: 26px; padding: 20px 18px 18px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .quiz-chip { background: var(--sun-soft); color: #A66A00; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; }
  .quiz-question { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.4; margin-bottom: 16px; }
  .quiz-img { width: 100%; border-radius: 14px; margin-bottom: 14px; display: block; }
  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answer-btn { text-align: left; border: 2px solid #EFECF6; background: var(--white); border-radius: 16px; padding: 14px 16px; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); cursor: pointer; transition: all 0.15s ease; }
  .answer-btn:active { transform: scale(0.98); }
  .answer-btn.correct { background: #E7F7EA; border-color: var(--leaf); color: #226B37; }
  .answer-btn.wrong { background: #FFEBEA; border-color: var(--coral); color: #A83226; }
  .answer-btn[disabled] { cursor: default; }

  .ds-context { background: #F3F0FA; border-radius: 16px; padding: 14px 16px; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 14.5px; line-height: 1.5; color: var(--ink); margin-bottom: 16px; }
  .ds-list { display: flex; flex-direction: column; gap: 12px; }
  .ds-statement { border: 2px solid #EFECF6; border-radius: 16px; padding: 12px 14px; transition: all 0.15s ease; }
  .ds-statement.ds-right { background: #E7F7EA; border-color: var(--leaf); }
  .ds-statement.ds-wrong { background: #FFEBEA; border-color: var(--coral); }
  .ds-text { font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 14.5px; line-height: 1.4; margin-bottom: 10px; }
  .ds-buttons { display: flex; gap: 8px; }
  .ds-btn { flex: 1; border: 2px solid #EFECF6; background: var(--white); border-radius: 12px; padding: 8px 0; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; }
  .ds-btn[disabled] { cursor: default; opacity: 0.7; }
  .explain-btn { margin-top: 14px; background: #F3F0FA; border: none; border-radius: 14px; padding: 10px 14px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 13px; color: #5B3BA6; cursor: pointer; width: 100%; }
  .explain-box { margin-top: 10px; background: #FFFBEA; border-radius: 14px; padding: 12px 14px; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 13.5px; line-height: 1.5; color: #6B5900; }
  .explain-box div + div { margin-top: 8px; }
  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 14px; display: none; align-items: center; gap: 8px; }
  .feedback.show { display: flex; }
  .feedback.good { background: #E7F7EA; color: #226B37; }
  .feedback.retry { background: #FFF0D1; color: #8A5A00; }
  .no-quiz { text-align: center; padding: 30px 20px; color: var(--ink-soft); font-weight: 600; }

  .mark-done-btn { width: 100%; border: none; background: var(--leaf); color: white; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; padding: 16px; border-radius: 18px; cursor: pointer; box-shadow: 0 6px 0 rgba(76,185,99,0.4); margin-bottom: 20px; transition: transform 0.12s ease; }
  .mark-done-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(76,185,99,0.4); }
  .mark-done-btn:disabled { background: #C7DFC9; box-shadow: none; }

  .mood-section { display: none; }
  .mood-section.show { display: block; animation: fadeUp 0.3s ease; }
  .mood-label { font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 15px; margin-bottom: 10px; }
  .mood-row { display: flex; gap: 10px; }
  .mood-btn { flex: 1; border: none; background: var(--white); border-radius: 16px; padding: 14px 0; font-size: 24px; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.12s ease; }
  .mood-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(51,43,82,0.12); }
  .mood-btn.picked { background: var(--sun-soft); }

  .done-banner { display: none; background: linear-gradient(135deg, var(--leaf), #6FD98A); color: white; border-radius: 20px; padding: 18px; text-align: center; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; margin-top: 16px; }
  .done-banner.show { display: block; animation: fadeUp 0.35s ease; }

  .demo-tag { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-family: 'Quicksand', sans-serif; font-size: 11px; color: var(--ink-soft); opacity: 0.5; }
</style>
</head>
<body>
<div class="phone">

  <div id="loadingScreen" class="loading">
    <div class="spin">🌀</div>
    <p>Đang tải dữ liệu...</p>
  </div>

  <div id="screenPickKid" class="screen">
    <div class="picker-title">Chào bạn! 👋</div>
    <div class="picker-sub">Hôm nay ai đang học nhỉ?</div>
    <div class="kid-list" id="kidList"></div>
  </div>

  <div id="screenSubjects" class="screen">
    <div class="header">
      <div class="greet"><span class="wave">👋</span> <span id="greetName">Chào bạn</span></div>
      <div class="streak"><span class="flame">🔥</span><span id="streakCount">0</span> ngày</div>
    </div>
    <div class="section-label">Học kỳ nào nào?</div>
    <div class="term-row" id="termRow"></div>
    <div class="section-label">Hôm nay học môn gì?</div>
    <div class="subjects" id="subjectGrid"></div>
    <button class="back-btn" onclick="showScreen('screenPickKid')">← Đổi bạn học khác</button>
  </div>

  <div id="screenLessons" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showScreen('screenSubjects')">←</button>
      <div class="greet" id="subjectTitle" style="flex:1;">Môn học</div>
    </div>
    <div id="unitList"></div>
  </div>

  <div id="screenQuiz" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showScreen('screenLessons')">←</button>
      <div class="greet" id="lessonTitle" style="font-size:16px; flex:1;">Bài học</div>
    </div>
    <div id="quizArea"></div>
    <button class="mark-done-btn" id="markDoneBtn">✅ Đánh dấu đã học xong</button>
    <div id="lockedNote" style="display:none;text-align:center;font-size:12.5px;color:#8a8478;margin-top:10px;">Bài này đã học hơn 24h trước, không tự sửa được nữa nhé.</div>
    <div class="mood-section" id="moodSection">
      <div class="mood-label">Bài này con thấy sao?</div>
      <div class="mood-row">
        <button class="mood-btn" onclick="pickMood(this,'😄')">😄</button>
        <button class="mood-btn" onclick="pickMood(this,'🙂')">🙂</button>
        <button class="mood-btn" onclick="pickMood(this,'😕')">😕</button>
        <button class="mood-btn" onclick="pickMood(this,'😣')">😣</button>
      </div>
    </div>
    <div class="done-banner" id="doneBanner">🎉 Xong rồi! Hẹn gặp lại nhé!</div>
  </div>

  <div class="demo-tag">Family OS · dữ liệu thật</div>
</div>

<script>
const CSV_LESSONS = "https://docs.google.com/spreadsheets/d/1d_glKGEHJ25gkwr8AP4OuJPozLJMKwBYPzeOxUu6w00/export?format=csv&gid=1899295567";
const CSV_KIDS    = "https://docs.google.com/spreadsheets/d/1d_glKGEHJ25gkwr8AP4OuJPozLJMKwBYPzeOxUu6w00/export?format=csv&gid=1721888103";
const CSV_QUIZ    = "https://docs.google.com/spreadsheets/d/1d_glKGEHJ25gkwr8AP4OuJPozLJMKwBYPzeOxUu6w00/export?format=csv&gid=1076715050";
const CSV_QUIZ_TOAN = "https://docs.google.com/spreadsheets/d/1d_glKGEHJ25gkwr8AP4OuJPozLJMKwBYPzeOxUu6w00/export?format=csv&gid=884854779";
const CSV_PROGRESS = "https://docs.google.com/spreadsheets/d/1d_glKGEHJ25gkwr8AP4OuJPozLJMKwBYPzeOxUu6w00/export?format=csv&gid=1514932059";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9Ntbdp0l2x2g2zfo6UF2tuh6ls-lri26Yf7MoWhNpu3lJecxVHX-LHkNbrYY6jMnA/exec";

const SUBJECT_META = {
  "Toán 6 Tập 1":     { emoji: "🔢", bg: "#FFE1DC", color: "#C43F2E", short: "Toán" },
  "Ngữ văn 6 Tập 1":  { emoji: "📖", bg: "#EBE1FF", color: "#5B3BA6", short: "Ngữ văn" },
  "Anh ngữ 6 Tập 1":  { emoji: "🗣️", bg: "#D6F5F0", color: "#0E8577", short: "Tiếng Anh" },
  "Toán 4 Tập 1":     { emoji: "🔢", bg: "#FFE1DC", color: "#C43F2E", short: "Toán" },
  "Tiếng việt 4 Tập 1": { emoji: "📖", bg: "#EBE1FF", color: "#5B3BA6", short: "Tiếng Việt" },
  "Anh ngữ 4 Tập 1":  { emoji: "🗣️", bg: "#D6F5F0", color: "#0E8577", short: "Tiếng Anh" }
};

let allLessons = [], allKids = [], allQuiz = [], allProgress = [], allQuizToan = [];
let currentKid = null, currentSubject = null, currentLesson = null, currentTerm = 'HK1';
let learnedThisSession = new Set(); // theo dõi tạm trong phiên (client-side)
const TERM_LIST = [
  { code: 'HK1', label: 'Học kỳ 1' },
  { code: 'HK2', label: 'Học kỳ 2' },
  { code: 'Hè', label: 'Học hè' }
];

function renderTermRow() {
  const row = document.getElementById('termRow');
  row.innerHTML = '';
  TERM_LIST.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'term-btn' + (t.code === currentTerm ? ' active' : '');
    btn.textContent = t.label;
    btn.onclick = () => { currentTerm = t.code; renderTermRow(); renderSubjects(); };
    row.appendChild(btn);
  });
}
function normTerm(v) {
  v = (v || '').toString().trim();
  if (v === '') return '1';
  return v.replace(/^HK/i, '');
}
function termMatches(cellVal, code) {
  return normTerm(cellVal) === normTerm(code);
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const headers = rows.shift() || [];
  return rows.filter(r => r.length > 1 || r[0] !== "").map(cells => {
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (cells[i] || "").trim());
    return obj;
  });
}

async function loadAll() {
  try {
    const [lText, kText, qText, pText] = await Promise.all([
      fetch(CSV_LESSONS).then(r => r.text()),
      fetch(CSV_KIDS).then(r => r.text()),
      fetch(CSV_QUIZ).then(r => r.text()),
      fetch(CSV_PROGRESS).then(r => r.text())
    ]);
    allLessons = parseCSV(lText);
    allKids = parseCSV(kText);
    allQuiz = parseCSV(qText);
    allProgress = parseCSV(pText);

    // Tải Quiz Toán riêng, không chặn app nếu lỗi (link chưa gắn đúng gid hoặc chưa có dữ liệu)
    try {
      const tText = await fetch(CSV_QUIZ_TOAN).then(r => r.text());
      allQuizToan = parseCSV(tText);
    } catch (e) {
      console.warn('Chưa tải được Quiz Toán, bỏ qua:', e);
      allQuizToan = [];
    }

    renderKidPicker();
    document.getElementById('loadingScreen').style.display = 'none';
    showScreen('screenPickKid');
  } catch (err) {
    document.getElementById('loadingScreen').innerHTML = '<p style="color:#C43F2E;">Không tải được dữ liệu 😢<br>Kiểm tra lại kết nối mạng nhé</p>';
    console.error(err);
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderKidPicker() {
  const list = document.getElementById('kidList');
  list.innerHTML = '';
  allKids.forEach(kid => {
    const btn = document.createElement('button');
    btn.className = 'kid-card';
    btn.innerHTML = `<div class="kid-avatar" style="background:${kid['Màu']}22;">${kid['Icon']}</div><span>${kid['Tên con']}</span>`;
    btn.onclick = () => selectKid(kid);
    list.appendChild(btn);
  });

  // Lựa chọn "Bố mẹ" — ngang hàng với các con, sẽ khoá bằng mã PIN riêng khi làm tính năng đó
  const parentBtn = document.createElement('button');
  parentBtn.className = 'kid-card';
  parentBtn.style.opacity = '0.8';
  parentBtn.innerHTML = `<div class="kid-avatar" style="background:#e3ddd022;">👨‍👩‍👧</div><span>Bố mẹ</span>`;
  parentBtn.onclick = () => { window.location.href = 'bo-me.html'; };
  list.appendChild(parentBtn);
}

function computeStreak(tenCon) {
  const days = new Set(
    allProgress
      .filter(p => p['Tên con'] === tenCon && (p['Trạng thái'] === 'Đã học' || p['Trạng thái'] === 'Trả lời câu hỏi'))
      .map(p => new Date(p['Ngày giờ']))
      .filter(d => !isNaN(d))
      .map(d => d.toISOString().slice(0, 10))
  );
  let streak = 0;
  let cursor = new Date();
  const todayStr = cursor.toISOString().slice(0, 10);
  if (!days.has(todayStr)) cursor.setDate(cursor.getDate() - 1); // hôm nay chưa học thì tính từ hôm qua, không cắt chuỗi ngay
  while (days.has(cursor.toISOString().slice(0, 10))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function selectKid(kid) {
  currentKid = kid;
  document.getElementById('greetName').textContent = 'Chào ' + kid['Tên con'];
  document.getElementById('streakCount').textContent = computeStreak(kid['Tên con']);

  // Trạng thái "đã học" tính theo DÒNG GẦN NHẤT của mỗi mã bài (không phải chỉ cần tồn tại 1 dòng)
  // — để xử lý đúng khi con bấm nhầm rồi bấm "Bỏ đánh dấu" sau đó
  const statusRows = allProgress.filter(p =>
    p['Tên con'] === kid['Tên con'] &&
    (p['Trạng thái'] === 'Đã học' || p['Trạng thái'] === 'Bỏ đánh dấu')
  );
  const latestStatusByLesson = {};
  const latestStatusTimeByLesson = {};
  statusRows
    .sort((a, b) => new Date(a['Ngày giờ']) - new Date(b['Ngày giờ']))
    .forEach(p => {
      latestStatusByLesson[p['Mã bài']] = p['Trạng thái'];
      latestStatusTimeByLesson[p['Mã bài']] = p['Ngày giờ'];
    });
  window._latestStatusTimeByLesson = latestStatusTimeByLesson;

  learnedThisSession = new Set(
    Object.keys(latestStatusByLesson).filter(maBai => latestStatusByLesson[maBai] === 'Đã học')
  );

  renderTermRow();
  renderSubjects();
  showScreen('screenSubjects');
}

function renderSubjects() {
  const grade = currentKid['Grade'];
  const lessonsForGrade = allLessons.filter(l => l['Grade'] === grade && termMatches(l['Học kỳ'], currentTerm));
  const subjects = [...new Set(lessonsForGrade.map(l => l['Subject']))];
  const grid = document.getElementById('subjectGrid');
  grid.innerHTML = '';

  if (subjects.length === 0) {
    grid.innerHTML = `<div class="no-data" style="grid-column:1/3;">Chưa có nội dung học cho lớp ${grade} 🌱<br>Sắp có sớm thôi!</div>`;
    return;
  }

  subjects.forEach(subj => {
    const meta = SUBJECT_META[subj] || { emoji: "📚", bg: "#EFECF6", color: "#6B6289", short: subj };
    const lessonsInSubj = lessonsForGrade.filter(l => l['Subject'] === subj && l['Lesson name'] && l['Lesson name'] !== 'Mục lục');
    const total = lessonsInSubj.length;
    const done = lessonsInSubj.filter(l => learnedThisSession.has(l['Lesson code'])).length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;

    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.style.background = meta.bg;
    tile.style.color = meta.color;
    tile.innerHTML = `<span class="emoji">${meta.emoji}</span><span>${meta.short}</span><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-text">${done}/${total} bài</span>`;
    tile.onclick = () => selectSubject(subj, lessonsInSubj);
    grid.appendChild(tile);
  });
}

function selectSubject(subj, lessons) {
  currentSubject = subj;
  const meta = SUBJECT_META[subj] || { short: subj, color: 'var(--ink-soft)' };
  document.getElementById('subjectTitle').textContent = meta.short;
  document.querySelectorAll('#screenLessons .back-btn, #screenQuiz .back-btn').forEach(b => {
    b.style.color = meta.color;
    b.style.background = (meta.bg || 'transparent') + '77';
  });

  // Nhóm theo Unit
  const units = {};
  lessons.forEach(l => {
    const u = l['Unit'] || 'Khác';
    if (!units[u]) units[u] = [];
    units[u].push(l);
  });

  const listEl = document.getElementById('unitList');
  listEl.innerHTML = '';

  Object.keys(units).forEach((unitName, idx) => {
    const items = units[unitName];
    const doneCount = items.filter(l => learnedThisSession.has(l['Lesson code'])).length;
    const badgeClass = doneCount === items.length ? 'done' : (doneCount > 0 ? 'partial' : 'todo');
    const badgeText = doneCount === items.length ? '✓' : `${doneCount}/${items.length}`;

    const card = document.createElement('div');
    card.className = 'unit-card';
    card.id = 'unit-' + idx;

    const header = document.createElement('div');
    header.className = 'unit-header';
    header.innerHTML = `
      <div class="unit-head-row">
        <div class="unit-badge ${badgeClass}">${badgeText}</div>
        <div class="unit-head-text">
          <div class="title">${unitName}</div>
          <div class="meta">${items.length} mục</div>
        </div>
      </div>
      <span class="chevron">▶</span>
    `;
    header.onclick = () => card.classList.toggle('open');

    const sublist = document.createElement('div');
    sublist.className = 'unit-sublist';
    items.forEach(item => {
      const checked = learnedThisSession.has(item['Lesson code']);
      const sub = document.createElement('div');
      sub.className = 'sub-item';
      sub.innerHTML = `
        <div class="sub-tick ${checked ? 'checked' : ''}">${checked ? '✓' : ''}</div>
        <div class="sub-name">${item['Lesson name']}</div>
      `;
      sub.onclick = (e) => { e.stopPropagation(); selectLesson(item); };
      sublist.appendChild(sub);
    });

    card.appendChild(header);
    card.appendChild(sublist);
    listEl.appendChild(card);
  });

  showScreen('screenLessons');
}

function selectLesson(lesson) {
  currentLesson = lesson;
  document.getElementById('lessonTitle').textContent = lesson['Lesson name'];

  document.getElementById('markDoneBtn').style.display = 'block';
  document.getElementById('markDoneBtn').disabled = false;
  updateMarkDoneBtn();
  document.getElementById('moodSection').classList.remove('show');
  document.getElementById('doneBanner').classList.remove('show');

  const quizArea = document.getElementById('quizArea');

  // Kiểm tra dữ liệu ở cả 2 nguồn cho bài này
  const toanRows = allQuizToan.filter(r => r['Mã bài'] === lesson['Lesson code']);
  const abcQuestions = allQuiz.filter(q => q['Mã bài'] === lesson['Lesson code'] && q['Câu hỏi']);

  const hasToan = toanRows.length > 0;
  const hasAbc = abcQuestions.length > 0;

  let showToan;
  if (hasToan && hasAbc) {
    // Cả 2 nguồn đều có: random mỗi lần vào bài, tỉ lệ 60% cơ bản (ABC) / 40% năng lực (Đúng-Sai)
    showToan = Math.random() < 0.4;
  } else if (hasToan) {
    showToan = true;
  } else if (hasAbc) {
    showToan = false;
  } else {
    quizArea.innerHTML = `<div class="no-quiz">📝 Bài này chưa có câu hỏi<br>Con có thể đọc lại nội dung rồi đánh dấu đã học nhé</div>`;
    showScreen('screenQuiz');
    return;
  }

  if (showToan) {
    renderToanQuizGroup(toanRows, quizArea);
    showScreen('screenQuiz');
    return;
  }

  // Dạng A/B/C/D (cơ bản) — lấy ngẫu nhiên tối đa 5 câu, hỏi tuần tự
  const questions = abcQuestions;
  const shuffled = [...questions].sort(() => Math.random() - 0.5);
  window._abcSet = shuffled.slice(0, 5);
  window._abcIndex = 0;
  window._abcResults = []; // { skill, level, correct: true/false }
  renderAbcQuestion();
  showScreen('screenQuiz');
}

function renderAbcQuestion() {
  const quizArea = document.getElementById('quizArea');
  const q = window._abcSet[window._abcIndex];
  const soCau = window._abcSet.length;
  const viTri = window._abcIndex + 1;

  let optionsHtml = '';
  ['A','B','C','D'].forEach(letter => {
    const val = q['Đáp án ' + letter];
    if (val) optionsHtml += `<button class="answer-btn" data-letter="${letter}" onclick="answerQuiz(this,'${letter}','${q['Đáp án đúng']}')">${letter}. ${val}</button>`;
  });

  quizArea.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-top">
        <span class="quiz-chip">${currentLesson['Unit'] || ''}</span>
        <span class="quiz-chip" style="background:#EBE1FF;color:#5B3BA6;">Câu ${viTri}/${soCau}</span>
      </div>
      ${q['Link ảnh'] ? `<img class="quiz-img" src="${toDirectDriveLink(q['Link ảnh'])}">` : ''}
      <div class="quiz-question">${q['Câu hỏi']}</div>
      <div class="answers">${optionsHtml}</div>
      <div class="feedback" id="feedback"></div>
      <button class="explain-btn" id="explainBtn" style="display:none" onclick="toggleExplain('abc')">👀 Xem giải thích</button>
      <div class="explain-box" id="explainBox" style="display:none"></div>
      <button class="mark-done-btn" id="nextQBtn" style="display:none;background:var(--grape);box-shadow:0 6px 0 #6D3FD1;" onclick="nextAbcQuestion()">
        ${viTri === soCau ? 'Xem kết quả →' : 'Câu tiếp theo →'}
      </button>
    </div>
  `;
  window._currentAbcQ = q;
}

function nextAbcQuestion() {
  window._abcIndex++;
  if (window._abcIndex < window._abcSet.length) {
    renderAbcQuestion();
  } else {
    renderAbcResults();
  }
}

function renderAbcResults() {
  const results = window._abcResults;
  const soDung = results.filter(r => r.correct).length;
  const tong = results.length;

  const rowsHtml = results.map((r, i) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #F2EFFA;font-size:14px;">
      <span>Câu ${i + 1}${r.skill ? ' · ' + r.skill : ''}</span>
      <span style="font-weight:700;color:${r.correct ? '#226B37' : '#A83226'};">${r.correct ? '✓ Đúng' : '✗ Sai'}</span>
    </div>
  `).join('');

  document.getElementById('quizArea').innerHTML = `
    <div class="quiz-card">
      <div style="text-align:center;margin-bottom:6px;">
        <div style="font-size:40px;">${soDung === tong ? '🏆' : soDung >= tong / 2 ? '🎉' : '💪'}</div>
        <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;">Đúng ${soDung}/${tong} câu</div>
      </div>
      <div style="margin-top:10px;">${rowsHtml}</div>
    </div>
  `;
}

// ==== QUIZ TOÁN: nhóm Đúng/Sai nhiều phát biểu, chấm điểm từng phần theo đúng thang Bộ GD-ĐT ====
function renderToanQuizGroup(rows, quizArea) {
  const context = rows.find(r => r['Loại'] === 'Context');
  const statements = rows.filter(r => r['Loại'] === 'Statement');

  let stmtHtml = '';
  statements.forEach((s, i) => {
    stmtHtml += `
      <div class="ds-statement" id="ds-stmt-${i}">
        <div class="ds-text"><b>${String.fromCharCode(97+i)})</b> ${s['Phát biểu']}</div>
        <div class="ds-buttons">
          <button class="ds-btn" onclick="answerDS(${i},'Đúng','${s['Đúng/Sai']}')">Đúng</button>
          <button class="ds-btn" onclick="answerDS(${i},'Sai','${s['Đúng/Sai']}')">Sai</button>
        </div>
      </div>`;
  });

  quizArea.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-top"><span class="quiz-chip">${currentLesson['Unit'] || ''}</span></div>
      ${context ? `<div class="ds-context">${context['Bối cảnh']}</div>` : ''}
      <div class="ds-list">${stmtHtml}</div>
      <div class="feedback" id="feedback"></div>
      <button class="explain-btn" id="explainBtn" style="display:none" onclick="toggleExplain('ds')">👀 Xem giải thích</button>
      <div class="explain-box" id="explainBox" style="display:none"></div>
    </div>
  `;

  // lưu trạng thái chấm điểm phiên này
  window._dsAnswers = new Array(statements.length).fill(null);
  window._dsCorrect = statements.map(s => s['Đúng/Sai']);
  window._dsSkills = statements.map(s => s['Năng lực']);
  window._dsExplain = statements.map(s => s['Giải thích'] || '');
}

function answerDS(idx, chosen, correct) {
  const el = document.getElementById('ds-stmt-' + idx);
  el.querySelectorAll('.ds-btn').forEach(b => b.disabled = true);
  const isRight = chosen === correct;
  el.classList.add(isRight ? 'ds-right' : 'ds-wrong');
  window._dsAnswers[idx] = isRight;

  // khi đủ tất cả các phát biểu đã trả lời, tính điểm theo thang Bộ GD-ĐT
  if (window._dsAnswers.every(a => a !== null)) {
    const soDung = window._dsAnswers.filter(a => a === true).length;
    let diem = 0;
    if (soDung === 1) diem = 0.1;
    else if (soDung === 2) diem = 0.25;
    else if (soDung === 3) diem = 0.5;
    else if (soDung === 4) diem = 1;
    const fb = document.getElementById('feedback');
    fb.className = 'feedback show ' + (soDung === window._dsAnswers.length ? 'good' : 'retry');
    fb.innerHTML = `🎯 Đúng ${soDung}/${window._dsAnswers.length} ý — điểm: ${diem}`;
    document.getElementById('explainBtn').style.display = 'block';

    // ghi Progress chi tiết từng phát biểu (mỗi phát biểu 1 dòng)
    window._dsAnswers.forEach((correct, i) => {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          tenCon: currentKid['Tên con'], maBai: currentLesson['Lesson code'], trangThai: 'Trả lời câu hỏi', mood: '',
          dang: 'Năng lực', skill: window._dsSkills[i] || '', level: '', dungSai: correct ? 'Đúng' : 'Sai'
        })
      }).catch(() => {});
    });
  }
}


function toDirectDriveLink(url) {
  const match = url.match(/\/d\/(.+?)\//);
  if (match) return `https://drive.google.com/uc?export=view&id=${match[1]}`;
  return url;
}

function answerQuiz(btn, letter, correctLetter) {
  document.querySelectorAll('#quizArea .answer-btn').forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  const isRight = letter === correctLetter;
  if (isRight) {
    btn.classList.add('correct');
    fb.className = 'feedback show good';
    fb.innerHTML = '🌟 Chính xác luôn!';
  } else {
    btn.classList.add('wrong');
    fb.className = 'feedback show retry';
    fb.innerHTML = '💡 Gần đúng rồi, xem lại bài nhé';
    document.querySelectorAll('#quizArea .answer-btn').forEach(b => {
      if (b.dataset.letter === correctLetter) b.classList.add('correct');
    });
  }
  document.getElementById('explainBtn').style.display = 'block';
  document.getElementById('nextQBtn').style.display = 'block';

  const q = window._currentAbcQ;
  window._abcResults.push({ skill: q['Skill'] || '', level: q['Level'] || '', correct: isRight });

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      tenCon: currentKid['Tên con'], maBai: currentLesson['Lesson code'], trangThai: 'Trả lời câu hỏi', mood: '',
      dang: 'Cơ bản', skill: q['Skill'] || '', level: q['Level'] || '', dungSai: isRight ? 'Đúng' : 'Sai'
    })
  }).catch(() => {});
}

function toggleExplain(kind) {
  const box = document.getElementById('explainBox');
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  if (kind === 'abc') {
    const q = window._currentAbcQ;
    box.innerHTML = q['Giải thích'] ? `💡 ${q['Giải thích']}` : 'Chưa có giải thích cho câu này.';
  } else {
    const items = window._dsExplain || [];
    box.innerHTML = items.map((t,i) => `<div><b>${String.fromCharCode(97+i)})</b> ${t || 'Chưa có giải thích'}</div>`).join('');
  }
  box.style.display = 'block';
}

function updateMarkDoneBtn() {
  const btn = document.getElementById('markDoneBtn');
  const isLearned = learnedThisSession.has(currentLesson['Lesson code']);

  if (isLearned) {
    const markedAt = window._latestStatusTimeByLesson[currentLesson['Lesson code']];
    const hoursSince = markedAt ? (new Date() - new Date(markedAt)) / 3600000 : 999;

    if (hoursSince <= 24) {
      btn.style.display = 'block';
      document.getElementById('lockedNote').style.display = 'none';
      btn.textContent = '↩️ Bỏ đánh dấu (đã học)';
      btn.style.background = '#B08A3E';
      btn.style.boxShadow = '0 6px 0 #8A6A2C';
      btn.onclick = unmarkDone;
    } else {
      // Quá 24h — con không tự bỏ đánh dấu được nữa, cần bố mẹ xử lý qua trang Bố mẹ
      btn.style.display = 'none';
      document.getElementById('lockedNote').style.display = 'block';
    }
  } else {
    btn.style.display = 'block';
    document.getElementById('lockedNote').style.display = 'none';
    btn.textContent = '✅ Đánh dấu đã học xong';
    btn.style.background = 'var(--leaf)';
    btn.style.boxShadow = '0 6px 0 rgba(76,185,99,0.4)';
    btn.onclick = markDone;
  }
}

function markDone() {
  const ok = confirm('Xác nhận: con đã học xong bài này rồi phải không?');
  if (!ok) return;

  const btn = document.getElementById('markDoneBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Đang lưu...';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ tenCon: currentKid['Tên con'], maBai: currentLesson['Lesson code'], trangThai: 'Đã học', mood: '' })
  }).then(() => {
    learnedThisSession.add(currentLesson['Lesson code']);
    window._latestStatusTimeByLesson[currentLesson['Lesson code']] = new Date().toString();
    btn.disabled = false;
    updateMarkDoneBtn();
    document.getElementById('moodSection').classList.add('show');
  }).catch(() => {
    btn.textContent = '⚠️ Lỗi lưu, thử lại';
    btn.disabled = false;
  });
}

function unmarkDone() {
  const ok = confirm('Bỏ đánh dấu "đã học" cho bài này? (VD nếu vừa bấm nhầm)');
  if (!ok) return;

  const btn = document.getElementById('markDoneBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Đang lưu...';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ tenCon: currentKid['Tên con'], maBai: currentLesson['Lesson code'], trangThai: 'Bỏ đánh dấu', mood: '' })
  }).then(() => {
    learnedThisSession.delete(currentLesson['Lesson code']);
    delete window._latestStatusTimeByLesson[currentLesson['Lesson code']];
    btn.disabled = false;
    updateMarkDoneBtn();
  }).catch(() => {
    btn.textContent = '⚠️ Lỗi lưu, thử lại';
    btn.disabled = false;
  });
}

function pickMood(btn, emoji) {
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('picked'));
  btn.classList.add('picked');
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ tenCon: currentKid['Tên con'], maBai: currentLesson['Lesson code'], trangThai: 'Mood', mood: emoji })
  }).then(() => document.getElementById('doneBanner').classList.add('show'));
}

loadAll();
</script>
